{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Maitri Global CRM Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#8b5cf6);
            font-family:Arial,sans-serif;
        }

        .login-box{
            width:420px;
            background:#fff;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,.3);
        }

        .top{
            background:linear-gradient(90deg,#4338ca,#9333ea);
            color:#fff;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .top h2{
            margin:0;
            font-weight:bold;
        }

        .body{
            padding:25px;
        }

        input{
            width:100%;
            margin-bottom:15px;
            padding:10px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        button{
            width:100%;
            border:none;
            padding:12px;
            border-radius:8px;
            color:#fff;
            font-weight:bold;
            background:linear-gradient(90deg,#6366f1,#a855f7);
        }

        button:hover{
            opacity:.9;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="top">
        <h2>Maitri Global CRM</h2>
            </div>

    <div class="body">

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">
                Log In
            </button>
        </form>

    </div>

</div>

</body>
</html>
