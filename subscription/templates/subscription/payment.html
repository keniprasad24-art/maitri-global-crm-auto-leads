<!DOCTYPE html>
<html>
<head>
    <title>Subscription Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body style="background:#f5f7fb;">

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg border-0 rounded-4">

<div class="card-header bg-primary text-white text-center">
<h3>Subscription Payment</h3>
</div>

<div class="card-body">

<h4>{{ subscription.customer_name }}</h4>

<hr>

<p><b>Plan :</b> {{ subscription.plan }}</p>

<p><b>Amount :</b> ₹{{ subscription.amount }}</p>

<hr>

<h5 class="text-center mb-3">Choose Payment Method</h5>

<div class="alert alert-success text-center">
    🔒 100% Secure Payment
</div>
<div class="row g-3 mt-3">

<div class="col-6">
<button class="btn btn-light border shadow-sm w-100 p-3">
💳 <b>Credit Card</b><br>
<small>Visa • MasterCard • RuPay</small>
</button>
</div>

<div class="col-6">
<button class="btn btn-light border shadow-sm w-100 p-3">
💳 <b>Debit Card</b><br>
<small>Visa • Maestro • RuPay</small>
</button>
</div>

<div class="col-6">
<button class="btn btn-light border shadow-sm w-100 p-3">
📱 <b>Google Pay</b><br>
<small class="text-success">Fast & Secure UPI</small>
</button>
</div>

<div class="col-6">
<button class="btn btn-light border shadow-sm w-100 p-3">
📱 <b>PhonePe</b><br>
<small style="color:#5f259f;">UPI Payment</small>
</button>
</div>

<div class="col-6">
<button class="btn btn-light border shadow-sm w-100 p-3">
🏦 <b>Net Banking</b><br>
<small>All Indian Banks</small>
</button>
</div>

<div class="col-6">
<button class="btn btn-light border shadow-sm w-100 p-3">
🔳 <b>UPI</b><br>
<small>BHIM / Paytm / GPay</small>
</button>
</div>

</div>

<hr>

<button id="pay-btn" class="btn btn-success btn-lg w-100 rounded-3">
🔒 Pay Securely
</button>

</div>

</div>

</div>

</div>

</div>

<script>
var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ order.amount }}",
    "currency": "INR",
    "name": "Maitri Global CRM",
    "description": "Subscription Payment",
    "order_id": "{{ order.id }}",

    "handler": function(response){
        alert("Payment Successful!");
        window.location.href="/subscription/";
    },

    "theme":{
        "color":"#4f46e5"
    }
};

var rzp = new Razorpay(options);

document.getElementById("pay-btn").onclick = function(e){
    if("{{ razorpay_key }}"==""){
        alert("Demo Mode - Razorpay API Keys not added yet.");
        return;
    }
    rzp.open();
    e.preventDefault();
}
</script>

</body>
</html>
