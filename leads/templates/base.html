 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maitri Global CRM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .navbar{
            background:linear-gradient(90deg,#5b21b6,#7c3aed);
            box-shadow:0 2px 10px rgba(0,0,0,.15);
        }

        .navbar-brand{
            font-size:24px;
            font-weight:bold;
            color:#fff !important;
        }

        .user-box{
            display:flex;
            align-items:center;
            color:white;
            font-weight:bold;
        }

        .logo{
            width:40px;
            height:40px;
            border-radius:50%;
            background:white;
            color:#5b21b6;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            margin-right:10px;
        }

        .logout-btn{
            margin-left:20px;
        }

        .content-box{
            background:white;
            border-radius:15px;
            padding:25px;
            margin-top:30px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }
    </style>

</head>

<body>


<div class="container">

    <div class="content-box">

           </div>

</div>

</body>
</html>
