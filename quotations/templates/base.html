<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CRM System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#f4f7fb;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:240px;
height:100vh;
background:#0f172a;
padding-top:20px;
overflow:auto;
}

.sidebar h3{
color:#fff;
text-align:center;
margin-bottom:25px;
font-weight:bold;
}

.sidebar a{
display:block;
padding:14px 22px;
color:#d1d5db;
text-decoration:none;
font-size:16px;
transition:.3s;
}

.sidebar a:hover{
background:#2563eb;
color:#fff;
padding-left:28px;
}

.main{
margin-left:240px;
}

.navbar{
background:#ffffff;
box-shadow:0 3px 10px rgba(0,0,0,.10);
padding:15px 25px;
}

.content{
padding:25px;
}

.card{
border:none;
border-radius:15px;
box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.table{
background:white;
}

.btn{
border-radius:10px;
}

</style>

</head>

<body>

<div class="sidebar">

<h3>
<i class="fa-solid fa-chart-line"></i>
CRM
</h3>

<a href="/">
<i class="fa-solid fa-gauge"></i>
Dashboard
</a>
