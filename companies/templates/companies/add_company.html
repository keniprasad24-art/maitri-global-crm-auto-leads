{% extends "crm_base.html" %}

{% block content %}

<div class="card shadow p-4">
    <h2 class="mb-4 text-center">🏢 Add Company</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="row">

            <div class="col-md-6 mb-3">
                <label>Company Name</label>
                <input type="text" name="company_name" class="form-control" value="{{ company.company_name }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" value="{{ company.email }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ company.phone }}">
            </div>

            <div class="col-md-6 mb-3">
                <label>Website</label>
                <input type="text" name="website" class="form-control" value="{{ company.website }}">
            </div>

            <div class="col-md-12 mb-3">
                <label>Address</label>
                <textarea name="address" class="form-control">{{ company.address }}</textarea>
            </div>

            <div class="col-md-4 mb-3">
                <label>City</label>
                <input type="text" name="city" class="form-control" value="{{ company.city }}">
            </div>

            <div class="col-md-4 mb-3">
                <label>State</label>
                <input type="text" name="state" class="form-control" value="{{ company.state }}">
            </div>

            <div class="col-md-4 mb-3">
                <label>Country</label>
                <input type="text" name="country" class="form-control" value="{{ company.country }}">
            </div>

        </div>

        <button type="submit" class="btn btn-success">
            Save Company
        </button>

        <a href="/companies/" class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

{% endblock %}
